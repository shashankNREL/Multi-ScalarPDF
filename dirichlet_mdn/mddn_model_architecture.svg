<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" role="img" aria-labelledby="title desc">
  <title id="title">Dirichlet Mixture Density Network Architecture</title>
  <desc id="desc">MDDN model with input size 4, hidden size 256, and outputs pi shape B by 16 and alpha shape B by 16 by 3.</desc>

  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 20px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #334155; }
      .label { font: 600 18px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 15px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #334155; }
      .inputBox { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.5; }
      .trunkBox { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.5; }
      .actBox { fill: #fef3c7; stroke: #d97706; stroke-width: 2.5; }
      .headPiBox { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2.5; }
      .headAlphaBox { fill: #fee2e2; stroke: #dc2626; stroke-width: 2.5; }
      .outputBox { fill: #e2e8f0; stroke: #334155; stroke-width: 2.5; }
      .arrow { stroke: #0f172a; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
      .branchArrow { stroke: #0f172a; stroke-width: 2.5; fill: none; marker-end: url(#arrowHead); }
      .note { font: 600 17px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #0f172a; }
      .badge { fill: #0f172a; rx: 12; ry: 12; }
      .badgeText { font: 700 16px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #ffffff; }
    </style>

    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0f172a" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1700" height="900" />

  <text class="title" x="70" y="70">Dirichlet Mixture Density Network (MDDN) - Trained Configuration</text>
  <text class="subtitle" x="70" y="108">Input moments: 4, Hidden width: 256, Mixture components K: 16</text>

  <!-- Top badges -->
  <rect class="badge" x="70" y="130" width="250" height="40" />
  <text class="badgeText" x="92" y="156">INPUT SIZE = 4</text>
  <rect class="badge" x="340" y="130" width="280" height="40" />
  <text class="badgeText" x="362" y="156">HIDDEN SIZE = 256</text>
  <rect class="badge" x="640" y="130" width="320" height="40" />
  <text class="badgeText" x="662" y="156">OUTPUTS: pi, alpha</text>

  <!-- Main trunk -->
  <rect class="inputBox" x="70" y="360" width="210" height="120" rx="16" />
  <text class="label" x="95" y="405">Input Moments</text>
  <text class="small" x="95" y="435">Tensor: m</text>
  <text class="small" x="95" y="460">Shape: (B, 4)</text>

  <rect class="trunkBox" x="350" y="360" width="250" height="120" rx="16" />
  <text class="label" x="375" y="405">Linear</text>
  <text class="small" x="375" y="435">4 -&gt; 128</text>
  <text class="small" x="375" y="460">Output: (B, 128)</text>

  <rect class="actBox" x="650" y="360" width="170" height="120" rx="16" />
  <text class="label" x="700" y="425">SiLU</text>

  <rect class="trunkBox" x="870" y="360" width="250" height="120" rx="16" />
  <text class="label" x="895" y="405">Linear</text>
  <text class="small" x="895" y="435">128 -&gt; 256</text>
  <text class="small" x="895" y="460">Output: (B, 256)</text>

  <rect class="actBox" x="1170" y="360" width="170" height="120" rx="16" />
  <text class="label" x="1220" y="425">SiLU</text>

  <rect class="trunkBox" x="1390" y="360" width="250" height="120" rx="16" />
  <text class="label" x="1415" y="405">Linear</text>
  <text class="small" x="1415" y="435">256 -&gt; 256</text>
  <text class="small" x="1415" y="460">Output: (B, 256)</text>

  <!-- Arrows main -->
  <path class="arrow" d="M 280 420 L 350 420" />
  <path class="arrow" d="M 600 420 L 650 420" />
  <path class="arrow" d="M 820 420 L 870 420" />
  <path class="arrow" d="M 1120 420 L 1170 420" />
  <path class="arrow" d="M 1340 420 L 1390 420" />

  <!-- Shared representation -->
  <rect class="outputBox" x="1435" y="550" width="210" height="90" rx="14" />
  <text class="label" x="1462" y="588">Shared h</text>
  <text class="small" x="1462" y="615">Shape: (B, 256)</text>
  <path class="arrow" d="M 1515 480 L 1515 550" />

  <!-- Branch to pi head -->
  <rect class="headPiBox" x="960" y="700" width="250" height="120" rx="16" />
  <text class="label" x="985" y="744">head_pi: Linear</text>
  <text class="small" x="985" y="772">256 -&gt; K = 16</text>
  <text class="small" x="985" y="798">Logits: (B, 16)</text>

  <rect class="headPiBox" x="670" y="700" width="230" height="120" rx="16" />
  <text class="label" x="740" y="744">Softmax</text>
  <text class="small" x="695" y="772">Along K dimension</text>

  <rect class="outputBox" x="380" y="700" width="230" height="120" rx="16" />
  <text class="label" x="430" y="744">Output pi</text>
  <text class="small" x="405" y="772">Mixture weights</text>
  <text class="small" x="430" y="798">Shape: (B, 16)</text>

  <path class="branchArrow" d="M 1475 640 L 1125 700" />
  <path class="branchArrow" d="M 960 760 L 900 760" />
  <path class="branchArrow" d="M 670 760 L 610 760" />

  <!-- Branch to alpha head -->
  <rect class="headAlphaBox" x="960" y="200" width="270" height="120" rx="16" />
  <text class="label" x="985" y="244">head_alpha: Linear</text>
  <text class="small" x="985" y="272">256 -&gt; 3*K = 48</text>
  <text class="small" x="985" y="298">Raw: (B, 48)</text>

  <rect class="headAlphaBox" x="650" y="200" width="270" height="120" rx="16" />
  <text class="label" x="670" y="239">Softplus + alpha_min</text>
  <text class="small" x="670" y="266">Clamp max = alpha_clip</text>
  <text class="small" x="670" y="293">Reshape to (B, 16, 3)</text>

  <rect class="outputBox" x="330" y="200" width="260" height="120" rx="16" />
  <text class="label" x="390" y="244">Output alpha</text>
  <text class="small" x="355" y="272">Dirichlet concentrations</text>
  <text class="small" x="390" y="298">Shape: (B, 16, 3)</text>

  <path class="branchArrow" d="M 1475 640 L 1125 320" />
  <path class="branchArrow" d="M 960 260 L 920 260" />
  <path class="branchArrow" d="M 650 260 L 590 260" />

  <!-- Footer note -->
  <text class="note" x="70" y="860">Trunk: Linear(4,128) -&gt; SiLU -&gt; Linear(128,256) -&gt; SiLU -&gt; Linear(256,256) -&gt; SiLU</text>
  <text class="note" x="70" y="885">Heads: pi=(B,16), alpha=(B,16,3) using K=16 and hidden size 256.</text>
</svg>
